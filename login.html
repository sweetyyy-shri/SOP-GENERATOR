<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SOP Generator - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #0f766e;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 18px;
            border: none;
            border-radius: 7px;
            background: #0d9488;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0f766e;
        }

        .switch {
            text-align: center;
            margin-top: 20px;
            color: #475569;
        }

        .switch a {
            color: #0d9488;
            cursor: pointer;
            font-weight: bold;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>SOP Generator</h1>
        <p class="subtitle" id="subtitle">
            Sign in to continue
        </p>

        <form id="authForm">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
                minlength="6"
            >

            <button type="submit" id="submitBtn">Login</button>
        </form>

        <p class="switch">
            <span id="switchText">Don't have an account?</span>
            <a id="switchMode">Sign Up</a>
        </p>

        <p id="message" role="status" aria-live="polite"></p>
    </div>

    <script type="module">
        import { auth } from "./firebase.js";

        import {
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

        const form = document.getElementById("authForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const submitBtn = document.getElementById("submitBtn");
        const switchMode = document.getElementById("switchMode");
        const switchText = document.getElementById("switchText");
        const subtitle = document.getElementById("subtitle");
        const message = document.getElementById("message");

        let isSignup = false;

        switchMode.addEventListener("click", () => {
            isSignup = !isSignup;

            submitBtn.textContent = isSignup ? "Create Account" : "Login";
            switchText.textContent = isSignup
                ? "Already have an account?"
                : "Don't have an account?";
            switchMode.textContent = isSignup ? "Login" : "Sign Up";
            subtitle.textContent = isSignup
                ? "Create your account"
                : "Sign in to continue";

            passwordInput.autocomplete = isSignup
                ? "new-password"
                : "current-password";

            message.textContent = "";
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            submitBtn.disabled = true;
            message.textContent = "Please wait...";

            try {
                if (isSignup) {
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );
                } else {
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );
                }

                message.textContent = "Login successful! Opening SOP Generator...";

                // Change this path if your index.html is in another folder.
                window.location.href = "./index.html";

            } catch (error) {
                const messages = {
                    "auth/email-already-in-use":
                        "This email already has an account. Please log in.",
                    "auth/invalid-email":
                        "Please enter a valid email address.",
                    "auth/weak-password":
                        "Choose a stronger password with at least 6 characters.",
                    "auth/invalid-credential":
                        "Email or password is incorrect.",
                    "auth/operation-not-allowed":
                        "Enable Email/Password in Firebase Authentication settings.",
                    "auth/unauthorized-domain":
                        "This website domain is not authorized in Firebase."
                };

                message.textContent =
                    messages[error.code] ||
                    "Unable to continue: " + error.message;

            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
